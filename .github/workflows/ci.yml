name: CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  APP_URL: ${{ vars.APP_URL }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run test

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run build

      - name: Upload Next.js build artifact
        id: upload_build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          if-no-files-found: error
          include-hidden-files: true

      - name: Publish app and artifact links in summary
        if: always()
        run: |
          echo "## LocalBoost AI Links" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$APP_URL" ]; then
            echo "- App URL: $APP_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- App URL: Not set. Add repository variable APP_URL." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Build Artifact: ${{ steps.upload_build.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"


  docker_smoke:
    name: Docker Build & Run
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t localboost-ai:ci .

      - name: Run Docker container
        run: docker run -d --name localboost-ai -p 3000:3000 localboost-ai:ci

      - name: Wait for app and validate home page
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3000 >/dev/null; then
              echo "App is up"
              exit 0
            fi
            sleep 2
          done
          echo "App did not start in time"
          docker logs localboost-ai || true
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f localboost-ai || true
