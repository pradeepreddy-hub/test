name: CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload Next.js build artifact
        id: upload_build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          if-no-files-found: error
          include-hidden-files: true

      - name: Publish app and artifact links in summary
        if: always()
        run: |
          echo "## LocalBoost AI Links" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$APP_URL" ]; then
            echo "- App URL: $APP_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- App URL: Not set. Add repository variable APP_URL." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Build Artifact: ${{ steps.upload_build.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"
